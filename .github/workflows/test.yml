name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Allow re-running the suite by hand, e.g. to check the Emacs cache.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs-version:
          - '28.1'
          - '29.4'
          - '30.1'

    name: Emacs ${{ matrix.emacs-version }}

    # The build lives inside the checkout, not in /opt: the runner user can
    # write there, so restoring a cache works without sudo, and actions/cache
    # rejects paths containing ".." (which silently disabled the cache).
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Needed on cache hits too: the cached binary links libgccjit.
      - name: Install Emacs dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential \
            libgnutls28-dev libxml2-dev libjansson-dev \
            libsqlite3-dev libtree-sitter-dev libgccjit-14-dev \
            libgif-dev libxpm-dev libjpeg-dev libtiff-dev \
            texinfo

      - name: Cache Emacs build
        id: cache-emacs
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.emacs-build
          # Bump the key whenever the install layout or configure flags change.
          key: emacs-${{ matrix.emacs-version }}-nativecomp-build-${{ runner.os }}

      - name: Install Emacs
        if: steps.cache-emacs.outputs.cache-hit != 'true'
        run: |
          set -e
          EMACS_VERSION="${{ matrix.emacs-version }}"
          EMACS_PREFIX="${GITHUB_WORKSPACE}/.emacs-build"
          echo "Building Emacs $EMACS_VERSION into ${EMACS_PREFIX}"
          mkdir -p "${EMACS_PREFIX}"
          cd /tmp
          wget -q "https://ftp.gnu.org/gnu/emacs/emacs-${EMACS_VERSION}.tar.xz"
          tar xf "emacs-${EMACS_VERSION}.tar.xz"
          cd "emacs-${EMACS_VERSION}"
          ./configure --with-no-popups --with-native-compilation --without-x \
            --prefix="${EMACS_PREFIX}" CFLAGS="-O2" \
            LDFLAGS="-L/usr/lib/gcc/x86_64-linux-gnu/14" \
            CPPFLAGS="-I/usr/lib/gcc/x86_64-linux-gnu/14/include"
          make -j$(nproc)
          make install

      - name: Put Emacs on PATH
        run: |
          EMACS_PREFIX="${GITHUB_WORKSPACE}/.emacs-build"
          echo "${EMACS_PREFIX}/bin" >> "$GITHUB_PATH"

      - name: Show Emacs version
        run: |
          EMACS_PREFIX="${GITHUB_WORKSPACE}/.emacs-build"
          if ! command -v emacs >/dev/null; then
            echo "::error::emacs is not on PATH; expected ${EMACS_PREFIX}/bin"
            ls -la "${EMACS_PREFIX}" 2>&1 || true
            exit 1
          fi
          emacs --version

      - name: Generate autoloads
        run: make autoloads-only

      - name: Run test suite
        run: make ci-test
