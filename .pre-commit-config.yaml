repos:
  - repo: local
    hooks:
      - id: editorconfig-fixes
        name: Fix editorconfig violations (final newlines and trailing whitespace)
        entry: make editorconfig
        language: system
        pass_filenames: false
        always_run: true
      - id: elisp-parens
        name: Check Elisp parentheses
        entry: make check-parens
        language: system
        files: \.el$
        pass_filenames: false
        always_run: true
